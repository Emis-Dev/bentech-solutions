<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00C875" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Group: Lightbulb + Circuit Arrows + Gear -->
  <g transform="translate(15, 10)">
    <!-- Lightbulb Outer Contour -->
    <path d="M 65 20 C 35 20, 15 42, 15 70 C 15 88, 28 104, 38 116 L 38 132 C 38 136, 42 140, 47 140 L 83 140 C 88 140, 92 136, 92 132 L 92 116 C 102 104, 115 88, 115 70 C 115 42, 95 20, 65 20 Z" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Lightbulb Filament Loops -->
    <path d="M 50 72 C 50 50, 60 50, 60 72 C 60 50, 70 50, 70 72 M 52 140 L 52 148 C 52 153, 78 153, 78 148 L 78 140 M 58 154 L 72 154" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lightbulb Top Rays -->
    <line x1="65" y1="2" x2="65" y2="12" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="12" x2="38" y2="20" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="100" y1="12" x2="92" y2="20" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Upper Circuit Arrow Line -->
    <path d="M 115 60 L 140 60 L 165 35 L 205 35" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 23 L 212 35 L 195 47" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower Circuit Arrow Line -->
    <path d="M 105 105 L 140 105 L 165 130 L 205 130" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 118 L 212 130 L 195 142" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gear Icon in Between Arrows -->
    <g transform="translate(175, 82)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="url(#emeraldGrad)" stroke-width="5" />
      <!-- Gear Teeth -->
      <line x1="0" y1="-21" x2="0" y2="-16" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="0" y2="21" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-21" y1="0" x2="-16" y2="0" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="21" y2="0" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-14" y1="-14" x2="-10" y2="-10" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="10" y1="10" x2="14" y2="14" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-14" y1="14" x2="-10" y2="10" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="14" y2="-14" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography Right Column: BenTech Solutions -->
  <text x="245" y="95" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="-1">BenTech</text>
  <text x="248" y="152" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="56" fill="url(#emeraldGrad)" letter-spacing="0">Solutions</text>
</svg>
